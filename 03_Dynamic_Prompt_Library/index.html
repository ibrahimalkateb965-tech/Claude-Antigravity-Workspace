<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأوامر الذكية | Smart Prompt Library</title>
    <!-- Google Fonts (Cairo for Headings, Tajawal for Body, Fira Code for Monospace, Outfit for Numbers) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;600;800;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for parsing XLSX directly in browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* ===== DESIGN TOKENS — GOOGLE STITCH & REFERO VERCEL / LINEAR DARK ===== */
        :root {
            /* Surfaces & Canvas (Linear Obsidian Developer Theme) */
            --bg: #08090e;
            --bg-canvas: #08090e;
            --bg-surface: #0f111a;
            --surface: rgba(15, 17, 26, 0.78);
            --surface-hover: rgba(22, 25, 38, 0.90);
            --bg-elevated: #161926;
            --bg-glass: rgba(15, 17, 26, 0.75);

            /* Hairline Borders & Inner Highlights (Vercel Refero Standards) */
            --border: rgba(255, 255, 255, 0.08);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-medium: rgba(255, 255, 255, 0.14);
            --border-active: rgba(99, 102, 241, 0.45);
            --border-glow: rgba(99, 102, 241, 0.25);
            --shadow-inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.09);

            /* Brand & Accents (Linear Indigo & Vercel Cyan) */
            --accent-primary: #6366f1;
            --accent-primary-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.35);

            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --neon-orange: #f97316;
            --neon-cyan: #06b6d4;
            --neon-green: #10b981;
            --neon-yellow: #f59e0b;

            /* Typography & Contrast (WCAG AA Compliant) */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;

            /* Typography Families */
            --font-heading: 'Cairo', 'Outfit', sans-serif;
            --font-body: 'Tajawal', sans-serif;
            --font-mono: 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;

            /* Spacing & Radii (4px/8px Refero Baseline) */
            --radius-xs: 6px;
            --radius-sm: 10px;
            --radius-md: 14px;
            --radius-card: 18px;
            --radius-pill: 9999px;

            /* Shadows & Depth */
            --shadow-card: 0 8px 32px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.08);
            --shadow-glow-purple: 0 0 32px rgba(168,85,247,0.22);
            --shadow-glow-pink: 0 0 32px rgba(236,72,153,0.22);
            --shadow-glow-primary: 0 0 32px rgba(99, 102, 241, 0.28);

            /* Kinetics & Spring Physics (Paul Bakaus Impeccable) */
            --ease-spring: cubic-bezier(0.16, 1, 0.3, 1);
            --duration-fast: 160ms;
            --duration-normal: 240ms;
        }

        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== ANIMATED MESH BACKGROUND ===== */
        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0 0 4rem 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(99,102,241,0.16) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(168,85,247,0.12) 0%, transparent 55%),
                radial-gradient(ellipse 50% 60% at 90% 70%, rgba(6,182,212,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 40% 50% at 5% 80%, rgba(99,102,241,0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0%   { opacity: 0.8; }
            50%  { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(99,102,241,0.14); top: -80px; right: -80px; animation-duration: 22s; }
        .orb-2 { width: 280px; height: 280px; background: rgba(168,85,247,0.10); bottom: 10%; left: -60px; animation-duration: 18s; animation-delay: -6s; }
        .orb-3 { width: 200px; height: 200px; background: rgba(6,182,212,0.08); top: 50%; right: 5%; animation-duration: 25s; animation-delay: -12s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* ===== PAGE WRAPPER ===== */
        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ===== HERO HEADER ===== */
        .hero {
            text-align: center;
            padding: 4rem 1rem 2.5rem;
            animation: fadeDown 0.8s var(--ease-spring) forwards;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.3);
            color: #818cf8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 1rem;
            border-radius: var(--radius-pill);
            margin-bottom: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .hero h1 {
            font-family: var(--font-heading);
            font-size: clamp(2.3rem, 5vw, 3.9rem);
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 10%, #c7d2fe 45%, var(--accent-primary) 75%, var(--neon-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 560px;
            margin: 0 auto;
            line-height: 1.65;
        }

        /* ===== STICKY CONTROL PANEL ===== */
        .control-panel-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
            background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
        }

        .control-panel {
            background: var(--bg-glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1rem 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            box-shadow: 0 4px 40px rgba(0,0,0,0.55), var(--shadow-inner-glow);
        }

        /* Search Box */
        .search-box {
            flex: 1;
            min-width: 220px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 1rem;
            outline: none;
            text-align: right;
            transition: border-color var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) var(--ease-spring);
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box input:focus {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .search-box .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: color var(--duration-fast);
        }

        .search-box input:focus ~ .search-icon { color: var(--accent-primary); }

        /* Upload Button — Single Primary CTA */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-flex;
        }

        .btn-upload {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.4rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, #4f46e5 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-sm);
            color: #fff;
            font-family: var(--font-heading);
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 20px var(--shadow-glow-primary), var(--shadow-inner-glow);
            transition: transform var(--duration-fast) var(--ease-spring), box-shadow var(--duration-fast) var(--ease-spring);
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(99, 102, 241, 0.5), var(--shadow-inner-glow);
        }

        .btn-upload:active { transform: translateY(1px) scale(0.99); }

        .upload-btn-wrapper input[type=file] {
            position: absolute; inset: 0;
            opacity: 0;
            cursor: pointer;
            font-size: 0;
        }

        /* ===== TABS ===== */
        .tabs-container {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.25rem 0 0.75rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .tab {
            padding: 0.5rem 1.15rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--duration-fast) var(--ease-spring);
            user-select: none;
        }

        .tab:hover {
            border-color: rgba(99,102,241,0.4);
            color: var(--text-primary);
            background: rgba(99,102,241,0.08);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(99,102,241,0.28), rgba(168,85,247,0.22));
            border-color: rgba(99,102,241,0.6);
            color: #fff;
            box-shadow: 0 0 18px rgba(99,102,241,0.25), var(--shadow-inner-glow);
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0 0.25rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .stats-bar span { display: flex; align-items: center; gap: 0.35rem; }
        .stats-bar strong { color: var(--accent-primary); font-weight: 700; font-family: 'Outfit', sans-serif; }

        /* ===== CARDS GRID ===== */
        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
            padding-top: 0.5rem;
        }

        /* ===== PROMPT CARD (Linear Obsidian Surface) ===== */
        .prompt-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            position: relative;
            overflow: hidden;
            text-align: right;
            box-shadow: var(--shadow-card);
            transition: transform var(--duration-normal) var(--ease-spring), box-shadow var(--duration-normal) var(--ease-spring), border-color var(--duration-normal) var(--ease-spring);
            animation: cardIn 0.45s var(--ease-spring) both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .prompt-card:hover {
            transform: translateY(-4px);
            border-color: rgba(99,102,241,0.38);
            box-shadow: var(--shadow-card), 0 0 28px rgba(99,102,241,0.2);
        }

        /* Top accent gradient bar */
        .prompt-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--neon-cyan), var(--neon-pink));
            border-radius: var(--radius-card) var(--radius-card) 0 0;
            opacity: 0;
            transition: opacity var(--duration-fast);
        }
        .prompt-card:hover::before { opacity: 1; }

        /* Card color variants */
        .prompt-card:nth-child(3n)::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(99,102,241,0.08) 0%, transparent 70%);
            pointer-events: none;
        }
        .prompt-card:nth-child(5n)::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(6,182,212,0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== CARD HEADER ===== */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .card-no {
            font-size: 0.75rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: #818cf8;
            background: rgba(99,102,241,0.12);
            border: 1px solid rgba(99,102,241,0.28);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-pill);
            letter-spacing: 0.03em;
        }

        .sheet-tag {
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.25);
            color: var(--neon-cyan);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-pill);
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Copy Button */
        .btn-copy {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.45rem 0.65rem;
            transition: all var(--duration-fast) var(--ease-spring);
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: rgba(99,102,241,0.15);
            border-color: rgba(99,102,241,0.4);
            color: var(--accent-primary);
            transform: scale(1.08);
        }

        .btn-copy.copied {
            background: rgba(16,185,129,0.15);
            border-color: rgba(16,185,129,0.4);
            color: var(--neon-green);
        }

        /* ===== CARD TITLE (Cairo Typography) ===== */
        .card-title {
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1.45;
        }

        /* ===== TRIGGER PROMPT BOX (Fira Code Monospace) ===== */
        .card-prompt {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: #e2e8f0;
            background: rgba(0,0,0,0.32);
            padding: 0.85rem 1rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-subtle);
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 160px;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
        }

        .card-prompt.rtl-text { text-align: right; }

        /* ===== AGENTS PILLS ===== */
        .card-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }

        .agents-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.1rem;
        }

        .agent-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.22rem 0.65rem;
            border-radius: var(--radius-pill);
            background: rgba(168,85,247,0.10);
            border: 1px solid rgba(168,85,247,0.2);
            color: #c4b5fd;
            white-space: nowrap;
        }

        .agent-pill::before { content: '🤖'; font-size: 0.65rem; }

        /* ===== DETAILS PANEL ===== */
        .card-details {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .details-section { display: flex; flex-direction: column; gap: 0.4rem; }

        .details-title {
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .details-title.goal-title { color: var(--neon-pink); }

        .details-body {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.65;
            max-height: 160px;
            overflow-y: auto;
        }
        .details-body ul, .details-body ol { padding-right: 1.2rem; margin-bottom: 0.4rem; }
        .details-body li { margin-bottom: 0.25rem; }
        .details-body p { margin-bottom: 0.4rem; }
        .details-body strong { color: var(--text-primary); font-weight: 600; }
        .details-body code {
            font-family: var(--font-mono);
            background: rgba(99,102,241,0.12);
            color: #c4b5fd;
            padding: 0.12em 0.45em;
            border-radius: 5px;
            font-size: 0.85em;
            border: 1px solid rgba(99,102,241,0.2);
        }

        /* ===== NOTES / MODEL ROW ===== */
        .card-notes {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.65rem 0.85rem;
            background: rgba(234,179,8,0.06);
            border: 1px solid rgba(234,179,8,0.15);
            border-radius: 10px;
            font-size: 0.8rem;
            color: #fde68a;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .card-notes i { margin-top: 0.15rem; flex-shrink: 0; color: var(--neon-yellow); }

        /* ===== DIVIDER ===== */
        .details-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 0.25rem 0;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }
        .empty-state p { font-size: 1rem; }

        /* ===== SCROLLBARS ===== */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.5); }
        * { scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.3) transparent; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .prompts-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2rem; }
            .control-panel { flex-direction: column; }
            .search-box { min-width: unset; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="page-wrapper">

        <!-- Hero -->
        <header class="hero">
            <div class="hero-badge"><i class="fa-solid fa-bolt"></i> AI Prompt Library</div>
            <h1>مكتبة الأوامر الذكية</h1>
            <p>تصفح وابحث وانسخ الخطافات الهندسية والبرومبتات التطويرية مباشرة — مدعومة بالذكاء الاصطناعي</p>
        </header>

        <!-- Sticky Control Panel -->
        <div class="control-panel-wrapper">
            <div class="control-panel">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍  ابحث في الخطافات، المحفزات، الوكلاء...">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                <div class="upload-btn-wrapper">
                    <button class="btn-upload"><i class="fa-solid fa-arrow-up-from-bracket"></i> رفع ملف جديد</button>
                    <input type="file" id="excelFile" accept=".xlsx" />
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-container" id="tabsContainer"></div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar"></div>

        <!-- Cards Grid -->
        <div class="prompts-grid" id="promptsGrid"></div>

    </div>

    <script>
        let libraryData = {
    "prompts": [
        {
            "No": "This helps create a strong brand\n foundation and guide your\n business decisions.",
            "Name": "clear and inspiring \nmission and vision\nfor your business.",

        let activeTab = "Custom_Skills.Claude";



























        let currentlyRendered = []; // Global array to prevent quote/backtick escaping issues in HTML attributes

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            renderTabs();
            renderCards();
            
            // Search Input listener
            document.getElementById("searchInput").addEventListener("input", () => {
                renderCards();
            });

            // Excel File parser listener
            document.getElementById("excelFile").addEventListener("change", handleFile, false);
        });

        // Render Navigation Tabs
        function renderTabs() {
            const container = document.getElementById("tabsContainer");
            container.innerHTML = "";
            
            // Add "ALL" tab first
            const allTab = document.createElement("div");
            allTab.className = `tab ${activeTab === "الكل (All)" ? 'active' : ''}`;
            allTab.textContent = "الكل (All)";
            allTab.onclick = () => {
                activeTab = "الكل (All)";
                renderTabs();
                renderCards();
            };
            container.appendChild(allTab);
            
            // Add individual sheet tabs
            Object.keys(libraryData).forEach(sheetName => {
                const tab = document.createElement("div");
                tab.className = `tab ${sheetName === activeTab ? 'active' : ''}`;
                tab.textContent = sheetName;
                tab.onclick = () => {
                    activeTab = sheetName;
                    renderTabs();
                    renderCards();
                };
                container.appendChild(tab);
            });
        }

        // Render Prompt Cards
        function renderCards() {
            const grid = document.getElementById("promptsGrid");
            const statsBar = document.getElementById("statsBar");
            grid.innerHTML = "";
            
            const query = document.getElementById("searchInput").value.toLowerCase();
            let currentPrompts = [];
            
            if (activeTab === "الكل (All)") {
                const uniquePrompts = new Set();
                Object.keys(libraryData).forEach(sheetName => {
                    libraryData[sheetName].forEach(item => {
                        const uniqueKey = (item.Prompt || item.Name || "").trim();
                        if (uniqueKey && !uniquePrompts.has(uniqueKey)) {
                            uniquePrompts.add(uniqueKey);
                            currentPrompts.push({ ...item, sourceSheet: sheetName });
                        }
                    });
                });
            } else {
                currentPrompts = libraryData[activeTab] || [];
            }
            
            currentlyRendered = currentPrompts.filter(item => {
                const name = (item.Name || "").toLowerCase();
                const text = (item.Prompt || "").toLowerCase();
                const note = (item.Notes || "").toLowerCase();
                const agents = (item.Agents || "").toLowerCase();
                const details = (item.Details || "").toLowerCase();
                const goal = (item.Goal || "").toLowerCase();
                return name.includes(query) || text.includes(query) || note.includes(query) || agents.includes(query) || details.includes(query) || goal.includes(query);
            });

            // Update stats bar
            if (statsBar) {
                statsBar.innerHTML = `
                    <span><i class="fa-solid fa-layer-group"></i> <strong>${currentlyRendered.length}</strong> خطاف</span>
                    <span><i class="fa-solid fa-folder"></i> <strong>${Object.keys(libraryData).length}</strong> قسم</span>
                `;
            }

            if (currentlyRendered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass empty-icon"></i><p>لا توجد خطافات مطابقة للبحث</p></div>`;
                return;
            }

            currentlyRendered.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "prompt-card";
                card.style.animationDelay = `${idx * 0.04}s`;
                
                const promptText = item.Prompt || '';
                const isRtl = /[\u0600-\u06ff]/.test(promptText);
                const alignClass = isRtl ? "rtl-text" : "";

                // Build agent pills HTML
                let agentPillsHtml = '';
                if (item.Agents) {
                    const agentList = item.Agents.split(',').map(a => a.trim()).filter(Boolean);
                    agentPillsHtml = `
                        <div class="card-agents">
                            <div class="agents-label"><i class="fa-solid fa-users-gear"></i> الوكلاء المسؤولون</div>
                            ${agentList.map(a => `<span class="agent-pill">${escapeHtml(a)}</span>`).join('')}
                        </div>`;
                }
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-header-left">
                            <span class="card-no">#${item.No || 1}</span>
                            ${item.sourceSheet ? `<span class="sheet-tag">${escapeHtml(item.sourceSheet)}</span>` : ''}
                        </div>
                        <button class="btn-copy" onclick="copyByIndex(this, ${idx})" title="نسخ المحفز">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                    <div class="card-title">${escapeHtml(item.Name || 'خطاف غير مسمى')}</div>
                    
                    <div class="card-prompt ${alignClass}">${escapeHtml(promptText)}</div>

                    ${agentPillsHtml}

                    ${item.Goal || item.Details ? `
                        <div class="card-details">
                            ${item.Goal ? `
                            <div class="details-section">
                                <div class="details-title goal-title"><i class="fa-solid fa-bullseye"></i> الهدف الأساسي</div>
                                <div class="details-body" dir="rtl">${marked.parse(item.Goal)}</div>
                            </div>` : ''}
                            
                            ${item.Goal && item.Details ? '<div class="details-divider"></div>' : ''}

                            ${item.Details ? `
                            <div class="details-section">
                                <div class="details-title"><i class="fa-solid fa-list-check"></i> الوصف والتفاصيل</div>
                                <div class="details-body" dir="rtl">${marked.parse(item.Details)}</div>
                            </div>` : ''}
                        </div>
                    ` : ''}

                    ${item.Notes ? `<div class="card-notes"><i class="fa-solid fa-microchip"></i> ${escapeHtml(item.Notes)}</div>` : ''}
                `;
                
                grid.appendChild(card);
            });
        }


        // Copy Clipboard action by array index
        function copyByIndex(button, index) {
            const item = currentlyRendered[index];
            if (!item) return;
            const textToCopy = item.Prompt || '';
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const icon = button.querySelector("i");
                icon.className = "fa-solid fa-check";
                button.classList.add('copied');
                setTimeout(() => {
                    icon.className = "fa-regular fa-copy";
                    button.classList.remove('copied');
                }, 1800);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }

        // Handle XLSX parsing
        function handleFile(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                processWorkbook(workbook);
            };
            reader.readAsArrayBuffer(file);
        }

        function processWorkbook(workbook) {
            const newLibrary = {};
            workbook.SheetNames.forEach(sheetName => {
                const ws = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(ws, {header: 1});
                
                if (json.length > 1) {
                    const headers = json[0] || [];
                    const colNo = headers.findIndex(h => typeof h === 'string' && h.includes('م'));
                    const colName = headers.findIndex(h => typeof h === 'string' && h.includes('اسم الخطاف'));
                    const colPrompt = headers.findIndex(h => typeof h === 'string' && h.includes('المحفزات'));
                    const colNotes = headers.findIndex(h => typeof h === 'string' && h.includes('النموذج'));
                    const colAgents = headers.findIndex(h => typeof h === 'string' && h.includes('الوكلاء'));
                    const colGoal = headers.findIndex(h => typeof h === 'string' && h.includes('الهدف'));
                    const colDetails = headers.findIndex(h => typeof h === 'string' && h.includes('الوصف'));

                    const iNo = colNo > -1 ? colNo : 0;
                    const iName = colName > -1 ? colName : 1;
                    const iPrompt = colPrompt > -1 ? colPrompt : 2;
                    const iNotes = colNotes > -1 ? colNotes : 3;
                    const iAgents = colAgents > -1 ? colAgents : 4;
                    const iGoal = colGoal > -1 ? colGoal : 5;
                    const iDetails = colDetails > -1 ? colDetails : 6;

                    const rows = [];
                    for (let r = 1; r < json.length; r++) {
                        const rowData = json[r];
                        if (rowData && rowData.length > 0) {
                            rows.push({
                                No: rowData[iNo] || r,
                                Name: rowData[iName] || "",
                                Prompt: rowData[iPrompt] || "",
                                Notes: rowData[iNotes] || "",
                                Agents: rowData[iAgents] || "",
                                Goal: rowData[iGoal] || "",
                                Details: rowData[iDetails] || ""
                            });
                        }
                    }
                    if (rows.length > 0) {
                        newLibrary[sheetName] = rows;
                    }
                }
            });
            
            if (Object.keys(newLibrary).length > 0) {
                libraryData = newLibrary;
                activeTab = "الكل (All)";
                renderTabs();
                renderCards();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
