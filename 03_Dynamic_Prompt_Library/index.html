<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة الأوامر الذكية | Smart Prompt Library</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS for parsing XLSX directly in browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <style>
        /* ===== DESIGN TOKENS — GEN Z NEON CANDY PALETTE ===== */
        :root {
            --bg: #0a0a12;
            --surface: rgba(18, 16, 35, 0.7);
            --surface-hover: rgba(28, 24, 52, 0.85);
            --border: rgba(255, 255, 255, 0.07);
            --border-glow: rgba(168, 85, 247, 0.3);

            /* Neon Candy Colors */
            --neon-purple: #a855f7;
            --neon-pink: #ec4899;
            --neon-orange: #f97316;
            --neon-cyan: #06b6d4;
            --neon-green: #22c55e;
            --neon-yellow: #eab308;

            --text-primary: #f1f0f9;
            --text-secondary: #a09ab8;
            --text-muted: #6b6484;

            --radius-card: 20px;
            --radius-pill: 100px;
            --shadow-card: 0 8px 32px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
            --shadow-glow-purple: 0 0 30px rgba(168,85,247,0.25);
            --shadow-glow-pink: 0 0 30px rgba(236,72,153,0.25);
        }

        /* ===== RESET ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ===== ANIMATED MESH BACKGROUND ===== */
        body {
            font-family: 'Tajawal', 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            padding: 0 0 4rem 0;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(168,85,247,0.18) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 10%, rgba(236,72,153,0.14) 0%, transparent 55%),
                radial-gradient(ellipse 50% 60% at 90% 70%, rgba(249,115,22,0.10) 0%, transparent 50%),
                radial-gradient(ellipse 40% 50% at 5% 80%, rgba(6,182,212,0.10) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
            animation: bgPulse 12s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0%   { opacity: 0.8; }
            50%  { opacity: 1; }
            100% { opacity: 0.7; }
        }

        /* Floating Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            animation: orbFloat 20s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: rgba(168,85,247,0.15); top: -80px; right: -80px; animation-duration: 22s; }
        .orb-2 { width: 280px; height: 280px; background: rgba(236,72,153,0.12); bottom: 10%; left: -60px; animation-duration: 18s; animation-delay: -6s; }
        .orb-3 { width: 200px; height: 200px; background: rgba(249,115,22,0.10); top: 50%; right: 5%; animation-duration: 25s; animation-delay: -12s; }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33%  { transform: translate(30px, -20px) scale(1.05); }
            66%  { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* ===== PAGE WRAPPER ===== */
        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        /* ===== HERO HEADER ===== */
        .hero {
            text-align: center;
            padding: 4rem 1rem 2.5rem;
            animation: fadeDown 0.8s ease forwards;
        }

        @keyframes fadeDown {
            from { opacity: 0; transform: translateY(-20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(168,85,247,0.15);
            border: 1px solid rgba(168,85,247,0.35);
            color: var(--neon-purple);
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.35rem 1rem;
            border-radius: var(--radius-pill);
            margin-bottom: 1.25rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .hero h1 {
            font-size: clamp(2.2rem, 5vw, 3.8rem);
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #fff 0%, var(--neon-purple) 40%, var(--neon-pink) 70%, var(--neon-orange) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            max-width: 520px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* ===== STICKY CONTROL PANEL ===== */
        .control-panel-wrapper {
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 1rem 0;
            background: linear-gradient(to bottom, var(--bg) 0%, transparent 100%);
        }

        .control-panel {
            background: rgba(14, 12, 26, 0.75);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1rem 1.25rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            box-shadow: 0 4px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* Search Box */
        .search-box {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1.2rem 0.8rem 2.8rem;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: 'Tajawal', sans-serif;
            font-size: 1rem;
            outline: none;
            text-align: right;
            transition: border-color 0.25s, box-shadow 0.25s;
        }

        .search-box input::placeholder { color: var(--text-muted); }

        .search-box input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 0 3px rgba(168,85,247,0.15);
        }

        .search-box .search-icon {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.25s;
        }

        .search-box input:focus ~ .search-icon { color: var(--neon-purple); }

        /* Upload Button */
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-flex;
        }

        .btn-upload {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.8rem 1.4rem;
            background: linear-gradient(135deg, var(--neon-purple), var(--neon-pink));
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 0 4px 20px rgba(168,85,247,0.35);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-upload:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(168,85,247,0.5);
        }

        .btn-upload:active { transform: translateY(0); }

        .upload-btn-wrapper input[type=file] {
            position: absolute; inset: 0;
            opacity: 0;
            cursor: pointer;
            font-size: 0;
        }

        /* ===== TABS ===== */
        .tabs-container {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding: 0.25rem 0 0.75rem;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .tab {
            padding: 0.5rem 1.1rem;
            border-radius: var(--radius-pill);
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.03);
            color: var(--text-secondary);
            font-family: 'Tajawal', sans-serif;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tab:hover {
            border-color: rgba(168,85,247,0.4);
            color: var(--text-primary);
            background: rgba(168,85,247,0.08);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(168,85,247,0.25), rgba(236,72,153,0.2));
            border-color: rgba(168,85,247,0.5);
            color: #fff;
            box-shadow: 0 0 16px rgba(168,85,247,0.2);
        }

        /* ===== STATS BAR ===== */
        .stats-bar {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            padding: 0 0.25rem;
            font-size: 0.82rem;
            color: var(--text-muted);
        }
        .stats-bar span { display: flex; align-items: center; gap: 0.35rem; }
        .stats-bar strong { color: var(--neon-purple); font-weight: 700; }

        /* ===== CARDS GRID ===== */
        .prompts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.25rem;
            padding-top: 0.5rem;
        }

        /* ===== PROMPT CARD ===== */
        .prompt-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-card);
            padding: 1.4rem;
            display: flex;
            flex-direction: column;
            gap: 0.9rem;
            position: relative;
            overflow: hidden;
            text-align: right;
            box-shadow: var(--shadow-card);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            animation: cardIn 0.45s ease both;
        }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(16px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .prompt-card:hover {
            transform: translateY(-4px);
            border-color: rgba(168,85,247,0.35);
            box-shadow: var(--shadow-card), var(--shadow-glow-purple);
        }

        /* Top accent gradient bar */
        .prompt-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; left: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--neon-purple), var(--neon-pink), var(--neon-orange));
            border-radius: var(--radius-card) var(--radius-card) 0 0;
            opacity: 0;
            transition: opacity 0.25s;
        }
        .prompt-card:hover::before { opacity: 1; }

        /* Card color variants */
        .prompt-card:nth-child(3n)::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(236,72,153,0.07) 0%, transparent 70%);
            pointer-events: none;
        }
        .prompt-card:nth-child(5n)::after {
            content: '';
            position: absolute;
            bottom: -30px; left: -30px;
            width: 120px; height: 120px;
            background: radial-gradient(circle, rgba(249,115,22,0.07) 0%, transparent 70%);
            pointer-events: none;
        }

        /* ===== CARD HEADER ===== */
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
        }

        .card-header-left {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .card-no {
            font-size: 0.75rem;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            color: var(--neon-purple);
            background: rgba(168,85,247,0.12);
            border: 1px solid rgba(168,85,247,0.25);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-pill);
            letter-spacing: 0.03em;
        }

        .sheet-tag {
            font-size: 0.72rem;
            font-weight: 600;
            background: rgba(6,182,212,0.12);
            border: 1px solid rgba(6,182,212,0.25);
            color: var(--neon-cyan);
            padding: 0.2rem 0.6rem;
            border-radius: var(--radius-pill);
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Copy Button */
        .btn-copy {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.45rem 0.65rem;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .btn-copy:hover {
            background: rgba(168,85,247,0.15);
            border-color: rgba(168,85,247,0.4);
            color: var(--neon-purple);
            transform: scale(1.08);
        }

        .btn-copy.copied {
            background: rgba(34,197,94,0.15);
            border-color: rgba(34,197,94,0.4);
            color: var(--neon-green);
        }

        /* ===== CARD TITLE ===== */
        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.45;
        }

        /* ===== TRIGGER PROMPT BOX ===== */
        .card-prompt {
            font-size: 0.9rem;
            color: var(--text-secondary);
            background: rgba(0,0,0,0.22);
            padding: 0.85rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            line-height: 1.55;
            white-space: pre-wrap;
            overflow-y: auto;
            max-height: 160px;
        }

        .card-prompt.rtl-text { text-align: right; }

        /* ===== AGENTS PILLS ===== */
        .card-agents {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            align-items: center;
        }

        .agents-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            width: 100%;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            margin-bottom: 0.1rem;
        }

        .agent-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.22rem 0.65rem;
            border-radius: var(--radius-pill);
            background: rgba(168,85,247,0.10);
            border: 1px solid rgba(168,85,247,0.2);
            color: #c4b5fd;
            white-space: nowrap;
        }

        .agent-pill::before { content: '🤖'; font-size: 0.65rem; }

        /* ===== DETAILS PANEL ===== */
        .card-details {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 14px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .details-section { display: flex; flex-direction: column; gap: 0.4rem; }

        .details-title {
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .details-title.goal-title { color: var(--neon-pink); }

        .details-body {
            color: var(--text-secondary);
            font-size: 0.875rem;
            line-height: 1.65;
            max-height: 160px;
            overflow-y: auto;
        }
        .details-body ul, .details-body ol { padding-right: 1.2rem; margin-bottom: 0.4rem; }
        .details-body li { margin-bottom: 0.25rem; }
        .details-body p { margin-bottom: 0.4rem; }
        .details-body strong { color: var(--text-primary); font-weight: 600; }
        .details-body code {
            background: rgba(168,85,247,0.12);
            color: #c4b5fd;
            padding: 0.1em 0.4em;
            border-radius: 5px;
            font-size: 0.85em;
        }

        /* ===== NOTES / MODEL ROW ===== */
        .card-notes {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            padding: 0.65rem 0.85rem;
            background: rgba(234,179,8,0.06);
            border: 1px solid rgba(234,179,8,0.15);
            border-radius: 10px;
            font-size: 0.8rem;
            color: #fde68a;
            white-space: pre-wrap;
            line-height: 1.5;
        }
        .card-notes i { margin-top: 0.15rem; flex-shrink: 0; color: var(--neon-yellow); }

        /* ===== DIVIDER ===== */
        .details-divider {
            height: 1px;
            background: rgba(255,255,255,0.06);
            margin: 0.25rem 0;
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 5rem 2rem;
            color: var(--text-muted);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            display: block;
            opacity: 0.5;
        }
        .empty-state p { font-size: 1rem; }

        /* ===== SCROLLBARS ===== */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(168,85,247,0.3); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(168,85,247,0.5); }
        * { scrollbar-width: thin; scrollbar-color: rgba(168,85,247,0.3) transparent; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .prompts-grid { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2rem; }
            .control-panel { flex-direction: column; }
            .search-box { min-width: unset; width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Floating Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="page-wrapper">

        <!-- Hero -->
        <header class="hero">
            <div class="hero-badge"><i class="fa-solid fa-bolt"></i> AI Prompt Library</div>
            <h1>مكتبة الأوامر الذكية</h1>
            <p>تصفح وابحث وانسخ الخطافات الهندسية والبرومبتات التطويرية مباشرة — مدعومة بالذكاء الاصطناعي</p>
        </header>

        <!-- Sticky Control Panel -->
        <div class="control-panel-wrapper">
            <div class="control-panel">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍  ابحث في الخطافات، المحفزات، الوكلاء...">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                </div>
                <div class="upload-btn-wrapper">
                    <button class="btn-upload"><i class="fa-solid fa-arrow-up-from-bracket"></i> رفع ملف جديد</button>
                    <input type="file" id="excelFile" accept=".xlsx" />
                </div>
            </div>
        </div>

        <!-- Tabs -->
        <div class="tabs-container" id="tabsContainer"></div>

        <!-- Stats -->
        <div class="stats-bar" id="statsBar"></div>

        <!-- Cards Grid -->
        <div class="prompts-grid" id="promptsGrid"></div>

    </div>

    <script>
        let libraryData = {
    "الملخص العام": [
        {
            "No": 1,
            "Name": "1. خطاف البدء والافتتاح",
            "Prompt": "بسم الله, بسم الله الرحمن الرحيم",
            "Notes": "الأساسي: `Gemini 3.7 Flash (High)` \n البديل: `Gemini 3.6 Flash (Medium)`",
            "Agents": "[prompt-engineer], [agent-optimizer]",
            "Goal": "تهيئة الجلسة، التحقق من القواعد الفنية واللغوية، وترشيد الاستهلاك.",
            "Details": "* **طريقة العمل والإجراءات:**\n  1. **تفعيل القواعد والتعليمات:** مراجعة وتطبيق كافة التوجيهات البرمجية واللغوية في المشروع (مثل الكتابة باللغة العربية، وتنسيق RTL).\n  2. **تحسين وترشيد الاستهلاك:** تحليل سياق المحادثة وتوجيهها لتكون بأعلى كفاءة مع توفير استهلاك التوكنز.\n  3. **إعلان الجاهزية:** إشعار المستخدم بتفعيل القواعد واستعداد الطاقم البرمجي للعمل."
        },
        {
            "No": 2,
            "Name": "2. خطاف هندسة السياق",
            "Prompt": "سياق المشروع, هندسة السياق",
            "Notes": "الأساسي: `Claude Sonnet 4.6 (Thinking)` \n البديل: `Claude Opus 4.6 (Thinking)`",

        let activeTab = "الكل (All)";
        let currentlyRendered = []; // Global array to prevent quote/backtick escaping issues in HTML attributes

        // Initialize UI
        document.addEventListener("DOMContentLoaded", () => {
            renderTabs();
            renderCards();
            
            // Search Input listener
            document.getElementById("searchInput").addEventListener("input", () => {
                renderCards();
            });

            // Excel File parser listener
            document.getElementById("excelFile").addEventListener("change", handleFile, false);
        });

        // Render Navigation Tabs
        function renderTabs() {
            const container = document.getElementById("tabsContainer");
            container.innerHTML = "";
            
            // Add "ALL" tab first
            const allTab = document.createElement("div");
            allTab.className = `tab ${activeTab === "الكل (All)" ? 'active' : ''}`;
            allTab.textContent = "الكل (All)";
            allTab.onclick = () => {
                activeTab = "الكل (All)";
                renderTabs();
                renderCards();
            };
            container.appendChild(allTab);
            
            // Add individual sheet tabs
            Object.keys(libraryData).forEach(sheetName => {
                const tab = document.createElement("div");
                tab.className = `tab ${sheetName === activeTab ? 'active' : ''}`;
                tab.textContent = sheetName;
                tab.onclick = () => {
                    activeTab = sheetName;
                    renderTabs();
                    renderCards();
                };
                container.appendChild(tab);
            });
        }

        // Render Prompt Cards
        function renderCards() {
            const grid = document.getElementById("promptsGrid");
            const statsBar = document.getElementById("statsBar");
            grid.innerHTML = "";
            
            const query = document.getElementById("searchInput").value.toLowerCase();
            let currentPrompts = [];
            
            if (activeTab === "الكل (All)") {
                const uniquePrompts = new Set();
                Object.keys(libraryData).forEach(sheetName => {
                    libraryData[sheetName].forEach(item => {
                        const uniqueKey = (item.Prompt || item.Name || "").trim();
                        if (uniqueKey && !uniquePrompts.has(uniqueKey)) {
                            uniquePrompts.add(uniqueKey);
                            currentPrompts.push({ ...item, sourceSheet: sheetName });
                        }
                    });
                });
            } else {
                currentPrompts = libraryData[activeTab] || [];
            }
            
            currentlyRendered = currentPrompts.filter(item => {
                const name = (item.Name || "").toLowerCase();
                const text = (item.Prompt || "").toLowerCase();
                const note = (item.Notes || "").toLowerCase();
                const agents = (item.Agents || "").toLowerCase();
                const details = (item.Details || "").toLowerCase();
                const goal = (item.Goal || "").toLowerCase();
                return name.includes(query) || text.includes(query) || note.includes(query) || agents.includes(query) || details.includes(query) || goal.includes(query);
            });

            // Update stats bar
            if (statsBar) {
                statsBar.innerHTML = `
                    <span><i class="fa-solid fa-layer-group"></i> <strong>${currentlyRendered.length}</strong> خطاف</span>
                    <span><i class="fa-solid fa-folder"></i> <strong>${Object.keys(libraryData).length}</strong> قسم</span>
                `;
            }

            if (currentlyRendered.length === 0) {
                grid.innerHTML = `<div class="empty-state"><i class="fa-solid fa-magnifying-glass empty-icon"></i><p>لا توجد خطافات مطابقة للبحث</p></div>`;
                return;
            }

            currentlyRendered.forEach((item, idx) => {
                const card = document.createElement("div");
                card.className = "prompt-card";
                card.style.animationDelay = `${idx * 0.04}s`;
                
                const promptText = item.Prompt || '';
                const isRtl = /[\u0600-\u06ff]/.test(promptText);
                const alignClass = isRtl ? "rtl-text" : "";

                // Build agent pills HTML
                let agentPillsHtml = '';
                if (item.Agents) {
                    const agentList = item.Agents.split(',').map(a => a.trim()).filter(Boolean);
                    agentPillsHtml = `
                        <div class="card-agents">
                            <div class="agents-label"><i class="fa-solid fa-users-gear"></i> الوكلاء المسؤولون</div>
                            ${agentList.map(a => `<span class="agent-pill">${escapeHtml(a)}</span>`).join('')}
                        </div>`;
                }
                
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-header-left">
                            <span class="card-no">#${item.No || 1}</span>
                            ${item.sourceSheet ? `<span class="sheet-tag">${escapeHtml(item.sourceSheet)}</span>` : ''}
                        </div>
                        <button class="btn-copy" onclick="copyByIndex(this, ${idx})" title="نسخ المحفز">
                            <i class="fa-regular fa-copy"></i>
                        </button>
                    </div>
                    <div class="card-title">${escapeHtml(item.Name || 'خطاف غير مسمى')}</div>
                    
                    <div class="card-prompt ${alignClass}">${escapeHtml(promptText)}</div>

                    ${agentPillsHtml}

                    ${item.Goal || item.Details ? `
                        <div class="card-details">
                            ${item.Goal ? `
                            <div class="details-section">
                                <div class="details-title goal-title"><i class="fa-solid fa-bullseye"></i> الهدف الأساسي</div>
                                <div class="details-body" dir="rtl">${marked.parse(item.Goal)}</div>
                            </div>` : ''}
                            
                            ${item.Goal && item.Details ? '<div class="details-divider"></div>' : ''}

                            ${item.Details ? `
                            <div class="details-section">
                                <div class="details-title"><i class="fa-solid fa-list-check"></i> الوصف والتفاصيل</div>
                                <div class="details-body" dir="rtl">${marked.parse(item.Details)}</div>
                            </div>` : ''}
                        </div>
                    ` : ''}

                    ${item.Notes ? `<div class="card-notes"><i class="fa-solid fa-microchip"></i> ${escapeHtml(item.Notes)}</div>` : ''}
                `;
                
                grid.appendChild(card);
            });
        }


        // Copy Clipboard action by array index
        function copyByIndex(button, index) {
            const item = currentlyRendered[index];
            if (!item) return;
            const textToCopy = item.Prompt || '';
            
            navigator.clipboard.writeText(textToCopy).then(() => {
                const icon = button.querySelector("i");
                icon.className = "fa-solid fa-check";
                button.classList.add('copied');
                setTimeout(() => {
                    icon.className = "fa-regular fa-copy";
                    button.classList.remove('copied');
                }, 1800);
            }).catch(err => {
                console.error("Failed to copy text: ", err);
            });
        }

        // Handle XLSX parsing
        function handleFile(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                processWorkbook(workbook);
            };
            reader.readAsArrayBuffer(file);
        }

        function processWorkbook(workbook) {
            const newLibrary = {};
            workbook.SheetNames.forEach(sheetName => {
                const ws = workbook.Sheets[sheetName];
                const json = XLSX.utils.sheet_to_json(ws, {header: 1});
                
                if (json.length > 1) {
                    const headers = json[0] || [];
                    const colNo = headers.findIndex(h => typeof h === 'string' && h.includes('م'));
                    const colName = headers.findIndex(h => typeof h === 'string' && h.includes('اسم الخطاف'));
                    const colPrompt = headers.findIndex(h => typeof h === 'string' && h.includes('المحفزات'));
                    const colNotes = headers.findIndex(h => typeof h === 'string' && h.includes('النموذج'));
                    const colAgents = headers.findIndex(h => typeof h === 'string' && h.includes('الوكلاء'));
                    const colGoal = headers.findIndex(h => typeof h === 'string' && h.includes('الهدف'));
                    const colDetails = headers.findIndex(h => typeof h === 'string' && h.includes('الوصف'));

                    const iNo = colNo > -1 ? colNo : 0;
                    const iName = colName > -1 ? colName : 1;
                    const iPrompt = colPrompt > -1 ? colPrompt : 2;
                    const iNotes = colNotes > -1 ? colNotes : 3;
                    const iAgents = colAgents > -1 ? colAgents : 4;
                    const iGoal = colGoal > -1 ? colGoal : 5;
                    const iDetails = colDetails > -1 ? colDetails : 6;

                    const rows = [];
                    for (let r = 1; r < json.length; r++) {
                        const rowData = json[r];
                        if (rowData && rowData.length > 0) {
                            rows.push({
                                No: rowData[iNo] || r,
                                Name: rowData[iName] || "",
                                Prompt: rowData[iPrompt] || "",
                                Notes: rowData[iNotes] || "",
                                Agents: rowData[iAgents] || "",
                                Goal: rowData[iGoal] || "",
                                Details: rowData[iDetails] || ""
                            });
                        }
                    }
                    if (rows.length > 0) {
                        newLibrary[sheetName] = rows;
                    }
                }
            });
            
            if (Object.keys(newLibrary).length > 0) {
                libraryData = newLibrary;
                activeTab = "الكل (All)";
                renderTabs();
                renderCards();
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text
                .toString()
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
